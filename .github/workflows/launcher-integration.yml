name: launcher-integration

# Single-edge cross-repo CI: when codetracer-php-recorder changes,
# verify the launcher's bundled-composer build still works against
# this recorder's source. Mirrors the pattern in
# codetracer-specs/Testing/Cross-Repo-CI-Integration.md.
#
# Added as part of the M9 extension that brought PHP / Composer /
# Packagist into the campaign's package-manager matrix alongside the
# original Python, Ruby, JavaScript trio.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  composer-bundling:
    # Self-hosted per ci-workflow-standards.md (no GitHub-hosted runners).
    # Toolchains come from nixpkgs on the runner instead of apt / marketplace
    # setup-* actions: the launcher's build.sh cross-compiles with `zig cc`,
    # and the composer package build/smoke-test needs php + composer.
    runs-on: eph-linux-x64
    name: composer bundling smoke-test
    steps:
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - uses: actions/checkout@v4
        with:
          path: codetracer-php-recorder

      - uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-launcher
          ref: main
          path: codetracer-launcher
          gh-token: ${{ steps.app-token.outputs.token }}

      - name: Build launcher
        # build.sh cross-compiles via `zig cc -target x86_64-linux-musl`, so
        # nim + zig from nixpkgs replace the setup-nim action and apt musl-tools.
        working-directory: codetracer-launcher
        run: nix shell nixpkgs#nim nixpkgs#zig -c bash ./build.sh --target linux-musl-x86_64 --out launcher

      - name: Build bundled composer package
        working-directory: codetracer-launcher/packaging/composer
        env:
          CT_LAUNCHER_VERSION: 0.1.0
          CT_LAUNCHER_BIN: ${{ github.workspace }}/codetracer-launcher/out/launcher
          CT_LAUNCHER_TARGET: linux-musl-x86_64
          # codetracer-php-recorder's PHP-side source lives at src/.
          # The launcher's build_composer.php vendors this tree under
          # lib/Recorder/ inside the produced zip.
          CT_RECORDER_SRC: ${{ github.workspace }}/codetracer-php-recorder/src
        run: nix shell nixpkgs#php -c php build_composer.php --out dist

      - name: Smoke-test the composer package
        working-directory: ${{ runner.temp }}
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/codetracer-launcher/packaging/composer/dist
        run: |
          mkdir -p compose-test && cd compose-test
          cat > composer.json <<EOF
          {
            "name": "ct/test",
            "minimum-stability": "dev",
            "repositories": [
              { "type": "artifact", "url": "${ARTIFACT_DIR}" }
            ],
            "require": { "metacraft-labs/codetracer": "0.1.0" }
          }
          EOF
          nix shell nixpkgs#php nixpkgs#phpPackages.composer -c bash -c '
            set -euo pipefail
            composer install --no-progress --no-interaction
            out=$(./vendor/bin/ct --version)
            echo "$out"
            echo "$out" | grep -qE "^ct [0-9]+\.[0-9]+"
          '
